<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="../js/pc-only.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한모 | 가상 404</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link href="../css/practice.css" rel="stylesheet">
  <link href="../css/normalize.css" rel="stylesheet">
  <link href="../css/incident-404.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/hanmo-policy-footer.css">
  <script src="../js/hanmo-policy-footer.js" defer></script>
</head>
<body class="hanmo-synthetic-404 hanmo-practice-layout">
  <main class="half">
    <nav class="navigation" aria-label="사용할 수 없는 모의신청 메뉴" aria-hidden="true" inert>
      <div class="userInfo">
                    <h1><span class='title'></span> 모의수강신청</h1>
                
					<p class='practiceMode'>연습 모드: BASIC MODE</p>
                    <p class="practice-profile-note">내정보 · 학교 로그인 아님</p>
                    <dl class="practice-profile" aria-label="직접 입력한 연습용 내정보">
                      <div><dt>입학년도</dt><dd data-practice-field="cohort">미입력</dd></div>
                      <div><dt>캠퍼스</dt><dd data-practice-field="campus">미입력</dd></div>
                      <div><dt>전공</dt><dd data-practice-field="major">미입력</dd></div>
                      <div><dt data-practice-field="secondaryLabel">이중전공/부전공</dt><dd data-practice-field="secondary">미입력</dd></div>
                    </dl>
                    <div class="practice-warning">
                      <strong><span aria-hidden="true">⚠︎</span> 모의수강신청 중</strong>
                      <span class="practice-warning-detail">실제 수강신청 시스템이 아니에요</span>
                    </div>
                </div>
      <div class="navButton">
        <button type="button" disabled tabindex="-1">메인 페이지</button>
        <button type="button" class="noticeButton" disabled tabindex="-1">Notice</button>
        <button type="button" disabled tabindex="-1">수강신청 및 수정/삭제</button>
        <button type="button" disabled tabindex="-1">수강신청열람</button>
        <button type="button" disabled tabindex="-1">시간표조회</button>
        <button type="button" disabled tabindex="-1">강의시간표조회</button>
      </div>
    </nav>
    <section class="hanmo-404-area" role="status" aria-labelledby="hanmo-404-title">
      <h2 id="hanmo-404-title">404</h2>
      <p>페이지를 표시할 수 없습니다.</p>
      <p>브라우저의 새로고침을 사용하세요.</p>
      <small>이 오류는 모의수강신청 돌발상황 연습이며 실제 학교 접속 장애가 아닙니다.</small>
    </section>
  </main>
  <script src="../js/student-profile-bar.js"></script>
  <script src="../js/incident-404.js"></script>
  <footer class="hanmo-policy-footer" aria-label="비공식 서비스 안내"><p><strong>본 서비스는 한국외국어대학교의 공식 서비스가 아니며, 정확한 정보는 학교 원문을 확인하시기 바랍니다.</strong></p></footer>
</body>
</html>
