<!doctype html>
<html lang="ko">
<head>
  <script src="../js/pc-only.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="학점·이수 현황 · 한모 학생용 학업 도우미">
  <title>학점·이수 현황 | 한모</title>
  <link rel="icon" href="../img/hanmo_color.png">
  <link rel="stylesheet" href="../css/student-ui.css">
  <script src="../js/student-progress.js" defer></script>
  <script src="../js/academic-progress.js" defer></script>
  <link rel="stylesheet" href="../css/academic-progress.css">
  <script src="../js/student-profile-bar.js" defer></script>
</head>
<body class="hanmo-ui">
  <a class="hanmo-skip" href="#main">본문으로 이동</a>
  <header class="hanmo-topbar">
  <a class="hanmo-brand" href="../index.html" aria-label="한모 홈으로 이동"><img src="../img/hanmo_white.svg" width="29" height="24" alt="">한모 <span>HUFS 학업 도우미</span></a>
  <nav aria-label="주요 서비스">
    <a href="./academic-timeline.html">학사 공지</a>
    <a href="./forecast.html">강의 전망</a>
    <a href="./catalog.html">강의 검색</a>
    <a href="./academic-progress.html" aria-current="page">학점 정리</a>
    <span class="hanmo-profile-summary" data-profile-summary role="status" aria-live="polite" aria-label="브라우저에 저장한 내정보, 학교 로그인 아님">내정보 미설정</span>
    <a class="hanmo-me-link" href="./planner.html">내정보</a>
  </nav>
</header>
  <main id="main" class="hanmo-main progress-main" tabindex="-1">
    <div class="progress-page-heading">
      <div class="hanmo-schoolmark">
        <h1>학점 정리</h1>
        <div class="hanmo-markline" aria-hidden="true"><span></span><img src="../img/hanmo_white.svg" alt=""><span></span></div>
      </div>
      <p>자가 입력 · 새로고침 시 초기화</p>
      <a href="https://hufs.ac.kr/" target="_blank" rel="noopener noreferrer">학교 공식 안내</a>
    </div>
    <section class="progress-panel progress-calculator" aria-labelledby="progress-form-title">
      <h2 id="progress-form-title">학점 계산</h2>
      <form id="credit-form" class="progress-form credit-form">
        <label for="credit-target">목표 학점<input id="credit-target" type="number" min="1" max="400" step="0.5" placeholder="예: 134" required></label>
        <label for="credit-earned">취득 학점<input id="credit-earned" type="number" min="0" max="400" step="0.5" placeholder="예: 64" required></label>
        <label for="credit-going">수강 중<input id="credit-going" type="number" min="0" max="100" step="0.5" value="0"></label>
        <label for="credit-planned">예정 학점<input id="credit-planned" type="number" min="0" max="100" step="0.5" value="0"></label>
        <button type="submit">계산</button>
        <button id="credit-reset" type="reset">초기화</button>
      </form>
      <div class="credit-output">
        <h3>계산 결과</h3>
        <div id="credit-summary" aria-live="polite">—</div>
        <div class="hanmo-progress-track" aria-hidden="true"><div id="credit-bar" class="hanmo-progress-fill"></div></div>
        <p id="credit-status" role="status"></p>
      </div>
    </section>
    <div class="progress-workspace">
      <section class="progress-panel" aria-labelledby="record-heading">
        <h2 id="record-heading">과목 기록</h2>
        <form id="record-form" class="progress-form">
          <label for="record-course">학수번호
            <input id="record-course" type="text" maxlength="128" placeholder="예: ECON101" autocomplete="off" required>
          </label>
          <label for="record-credits">학점
            <input id="record-credits" type="number" min="0.5" max="30" step="0.5" value="3" required>
          </label>
          <label for="record-term">학기
            <input id="record-term" type="text" pattern="20[0-9]{2}-[12]" maxlength="6" placeholder="예: 2025-1" required>
          </label>
          <label for="record-slot">상태
            <select id="record-slot">
              <option value="EARNED">취득 완료</option>
              <option value="IN_PROGRESS">수강 중</option>
            </select>
          </label>
          <div class="progress-form-action"><button id="record-add" type="submit">기록 추가</button></div>
        </form>
        <p id="record-message" class="progress-message" role="status" aria-live="polite"></p>
        <div class="progress-table-scroll" role="region" aria-label="직접 입력한 과목 기록" tabindex="0">
          <table><thead><tr><th scope="col">학수번호</th><th scope="col">학기</th><th scope="col">학점</th><th scope="col">상태</th><th scope="col">삭제</th></tr></thead><tbody id="record-rows"></tbody></table>
        </div>
        <div id="credit-overview" class="credit-overview" role="status"></div>
      </section>
      <section class="progress-panel" aria-labelledby="scenarios-heading">
        <div class="progress-panel-heading">
          <h2 id="scenarios-heading">학기 계획</h2>
          <fieldset class="scenario-fieldset" id="scenario-choice">
            <legend>계획 선택</legend>
            <label><input type="radio" name="scenario" value="A" checked> A안 · 2학기</label>
            <label><input type="radio" name="scenario" value="B"> B안 · 3학기</label>
            <label><input type="radio" name="scenario" value="C"> C안 · 4학기</label>
          </fieldset>
        </div>
        <form id="plan-form" class="progress-form">
          <label for="plan-term">학기
            <select id="plan-term" required></select>
          </label>
          <label for="plan-course">학수번호
            <input id="plan-course" type="text" maxlength="128" autocomplete="off" placeholder="예: ECON201" required>
          </label>
          <label for="plan-credits">학점
            <input id="plan-credits" type="number" min="0.5" max="30" step="0.5" value="3" required>
          </label>
          <div class="progress-form-action"><button id="plan-add" type="submit">계획 추가</button></div>
        </form>
        <p id="plan-message" class="progress-message" role="status" aria-live="polite"></p>
        <div id="plan-rows" class="plan-rows" role="region" aria-label="선택한 계획의 과목 목록" tabindex="0"></div>
      </section>
    </div>
    <section class="progress-panel progress-comparison" aria-labelledby="compare-heading">
      <h2 id="compare-heading">A/B/C 계획 비교</h2>
      <div id="scenario-comparison" aria-live="polite"></div>
    </section>
  </main>
  <footer class="hanmo-footer">© 한모 · 비공식 학습 지원</footer>
</body>
</html>
