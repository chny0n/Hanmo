<html lang="ko">
    <head>
  <script src="../js/pc-only.js"></script>

        <title>한모 | 모의수강신청 연습</title>
        <meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
		<link rel="icon" type="image/png" href="../img/favicon.png">
		<link href="../css/practice.css" rel="stylesheet" type="text/css">
		<link href="../css/normalize.css" rel="stylesheet" type="text/css">
    	<link href="../css/gnb.css" rel="stylesheet" type="text/css">
		<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
	  <link rel="stylesheet" href="../css/hanmo-policy-footer.css">
	  <script src="../js/hanmo-policy-footer.js" defer></script>
</head>
    <body class="hanmo-practice-layout">
        <main class="half"> <!--메뉴(왼쪽)와 정보(오른쪽) 나눔(display: grid)-->
            <section class="navigation"> <!--화면의 왼쪽 메뉴에 해당, HUFS Blue(위)과 HUFS GOLD(아래) 나눔(display: grid)-->
                <div class="userInfo"> <!--HUFS Blue-->
				<h1><span class='title'></span> 모의수강신청</h1>
                
					<p class='practiceMode'></p>
                    <p class="practice-profile-note">내정보 · 학교 로그인 아님</p>
                    <dl class="practice-profile" aria-label="직접 입력한 연습용 내정보">
                      <div><dt>입학년도</dt><dd data-practice-field="cohort">미입력</dd></div>
                      <div><dt>캠퍼스</dt><dd data-practice-field="campus">미입력</dd></div>
                      <div><dt>전공</dt><dd data-practice-field="major">미입력</dd></div>
                      <div><dt data-practice-field="secondaryLabel">이중전공/부전공</dt><dd data-practice-field="secondary">미입력</dd></div>
                    </dl>
                    <div class="practice-warning">
                      <strong><span aria-hidden="true">⚠︎</span> 모의수강신청 중</strong>
                      <span class="practice-warning-detail">실제 수강신청 시스템이 아니에요</span>
                    </div>
                </div>
                <div class="navButton"> <!--HUFS GOLD부분-->
                    <button onclick="location.href='vsugang.html'">메인 페이지</button>
                    <button class="noticeButton" onclick="location.href='#'">Notice</button>
                    <button class="sugang" onclick="location.href='selectZone.html'">수강신청 및 수정/삭제</button>
                    <button>수강신청열람</button>
                    <button>시간표조회</button>
                    <button>강의시간표조회</button>
                </div>
            </section>
            <section class="mainArea"> <!--화면의 오른쪽 정보 출력에 해당, 내용 가운데 배치를 위해 grid 사용-->
				<section class='f-dirt-down'>
					<div class="timerLoc">
						<div class = "timer"><span id="hours">--:--:--</span></div>
					</div>
					<p class='alert'>※이 화면은 실제 신청이 아닌 합성 연습입니다.</p>
					<p class='alert'>※사용자 개인의 실수로 인해 발생한 문제는 개발자가 책임을 지지 않습니다.</p>
				</section>
				<section class='f-dirt-up'>
					<div></div>
				</section>
            </section>
        </main>
		<script src="../js/student-profile-bar.js"></script>
		<script src="../js/gnb.js"></script>
        <script src="../js/practice.js"></script>
		<script src='../js/hanmoSys.js'></script>
      <footer class="hanmo-policy-footer" aria-label="비공식 서비스 안내"><p><strong>본 서비스는 한국외국어대학교의 공식 서비스가 아니며, 정확한 정보는 학교 원문을 확인해 주세요.</strong></p></footer>
</body>
</html>
