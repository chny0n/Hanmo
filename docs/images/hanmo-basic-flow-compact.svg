<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="294" viewBox="0 0 1280 294" role="img" aria-labelledby="title desc">
<title id="title">BASIC 모드 돌발상황 흐름도, 축약</title>
<desc id="desc">BASIC 연습에서 돌발상황을 활성화하면 가상 404가 한 번 표시되고, 브라우저 새로고침으로 복구합니다. 페이지 접속 대기를 활성화했다면 복구 후 대기하고 기존 신청을 이어갑니다. 돌발상황은 기본 OFF입니다.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071925"/><stop offset="1" stop-color="#103247"/></linearGradient>
 <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75A9BD"/></marker>
</defs>
<g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
<rect x="0" y="0" width="1280" height="294" rx="17" fill="url(#bg)"/>
<text x="38" y="56" fill="#F6F9FC" font-size="27" font-weight="800" >BASIC  /  선택형 돌발상황</text>
<rect x="1080" y="26" width="160" height="40" rx="20" fill="#233A3F" stroke="#627C77"/>
<text x="1160" y="53" fill="#BFDAD8" font-size="19" font-weight="740" text-anchor="middle">기본값 OFF</text>
<rect x="38" y="107" width="211" height="110" rx="15" fill="#0E3145" stroke="#3A718C" stroke-width="1.5"/>
<text x="56" y="132" fill="#9BC4D7" font-size="15" font-weight="750" letter-spacing="1.1">STEP 01</text>
<text x="56" y="168" fill="#F4F9FC" font-size="24" font-weight="780" >기존 연습</text>
<text x="56" y="195" fill="#BFD7E4" font-size="17" font-weight="510" >BASIC 시작</text>
<rect x="285" y="107" width="205" height="110" rx="15" fill="#322C28" stroke="#C49B55" stroke-width="1.5"/>
<text x="303" y="132" fill="#F9D592" font-size="15" font-weight="750" letter-spacing="1.1">STEP 02 · ON</text>
<text x="303" y="168" fill="#F4F9FC" font-size="24" font-weight="780" >가상 404</text>
<text x="303" y="195" fill="#BFD7E4" font-size="17" font-weight="510" >한 번만 표시</text>
<rect x="526" y="107" width="213" height="110" rx="15" fill="#0E3145" stroke="#3A718C" stroke-width="1.5"/>
<text x="544" y="132" fill="#9BC4D7" font-size="15" font-weight="750" letter-spacing="1.1">STEP 03</text>
<text x="544" y="168" fill="#F4F9FC" font-size="24" font-weight="780" >새로고침</text>
<text x="544" y="195" fill="#BFD7E4" font-size="17" font-weight="510" >정상 화면 복구</text>
<rect x="775" y="107" width="209" height="110" rx="15" fill="#0E3145" stroke="#3A718C" stroke-width="1.5"/>
<text x="793" y="132" fill="#9BC4D7" font-size="15" font-weight="750" letter-spacing="1.1">STEP 04</text>
<text x="793" y="168" fill="#F4F9FC" font-size="24" font-weight="780" >접속 대기</text>
<text x="793" y="195" fill="#BFD7E4" font-size="17" font-weight="510" >설정이 ON일 때만</text>
<rect x="1020" y="107" width="220" height="110" rx="15" fill="#0E3145" stroke="#3A718C" stroke-width="1.5"/>
<text x="1038" y="132" fill="#9BC4D7" font-size="15" font-weight="750" letter-spacing="1.1">STEP 05</text>
<text x="1038" y="168" fill="#F4F9FC" font-size="24" font-weight="780" >신청 계속</text>
<text x="1038" y="195" fill="#BFD7E4" font-size="17" font-weight="510" >기존 결과 흐름</text>
<path d="M252 162 H280" stroke="#75A9BD" stroke-width="2.5" marker-end="url(#arr)"/><path d="M490 162 H521" stroke="#75A9BD" stroke-width="2.5" marker-end="url(#arr)"/><path d="M739 162 H770" stroke="#75A9BD" stroke-width="2.5" marker-end="url(#arr)"/><path d="M984 162 H1015" stroke="#75A9BD" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M38 249 H1240" stroke="#426477" stroke-width="1"/>
<text x="40" y="274" fill="#C9DFE8" font-size="19" font-weight="570" >돌발상황 OFF → 정상 신청 진행</text>
<text x="1240" y="274" fill="#E7CB8D" font-size="19" font-weight="550" text-anchor="end">ON인 경우 새로고침 복구 후 접속 대기 적용</text>
</g></svg>