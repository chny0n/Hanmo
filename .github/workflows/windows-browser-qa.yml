name: Windows browser QA (#71 #72)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'html/**'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - '.nvmrc'
      - '.npmrc'
      - '.github/workflows/windows-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: windows-browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [chrome, msedge]
    env:
      HANMO_BROWSER_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch the original UI baseline for browser QA
        run: git fetch --depth=1 --no-tags origin 0df1c0dafd23939f48b35aa68614e8461bb83b31
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static preview
        id: build
        run: npm run build
      - name: Record actual installed browser and operating system
        run: node scripts/record-browser-qa.mjs
      - name: Run legacy and student browser regression suite
        run: npm run test:e2e
      - name: Run feature browser QA
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright test --config tests/playwright-feature.config.mjs --output=windows-feature-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: hanmo-windows-${{ matrix.channel }}-${{ github.sha }}
          path: |
            qa-artifacts/
            playwright-report/
            test-results/
            windows-feature-results/
            e2e-artifacts/
          retention-days: 14
