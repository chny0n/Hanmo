name: Legacy practice behavior
on:
  pull_request:
    paths:
      - 'js/practice.js'
      - 'js/pc-only.js'
      - 'html/pc-only.html'
      - 'index.html'
      - 'html/**'
      - 'degree-rescue/*.html'
      - 'tests/device-gate.test.cjs'
      - 'js/selectZone.js'
      - 'js/result.js'
      - 'js/vsugang.js'
      - 'js/gnb.js'
      - 'js/hanmoSys.js'
      - 'js/index.js'
      - 'tests/legacy-baseline.test.cjs'
      - '.github/workflows/legacy-maintainability-ci.yml'

permissions:
  contents: read

jobs:
  original-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check js/practice.js
          node --check js/pc-only.js
          node --check js/selectZone.js
          node --check js/result.js
          node --check js/vsugang.js
          node --check js/gnb.js
          node --check js/hanmoSys.js
          node --check js/index.js
      - name: Behavioral contract
        run: node --test tests/legacy-baseline.test.cjs tests/device-gate.test.cjs
