name: Publish Hanmo QA preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'degree-rescue/**'
      - 'index.html'
      - 'pc-only.html'
      - 'tests/device-gate.test.cjs'
      - 'tests/legacy-baseline.test.cjs'
      - 'html/**'
      - 'js/**'
      - 'css/**'
      - 'img/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-qa
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install browser-only planner dependencies
        working-directory: degree-rescue
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check PC-only policy and original practice behavior
        run: node --test tests/device-gate.test.cjs tests/legacy-baseline.test.cjs
      - name: Run TypeScript, synthetic regression and static-site checks
        working-directory: degree-rescue
        run: npm run check
      - name: Protect the original site's custom domain
        run: |
          test ! -e CNAME
          test ! -e degree-rescue/dist/CNAME
          test -f degree-rescue/dist/index.html
          test -f degree-rescue/dist/degree-rescue/index.html
          test -f degree-rescue/dist/degree-rescue/public/app.js
      - name: Configure GitHub Pages (fork project URL only)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload generated static site without CNAME
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: degree-rescue/dist
      - name: Deploy QA preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
