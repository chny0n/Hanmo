name: Rebuild JavaScript from original TypeScript once
on:
  push:
    branches: [refactor/javascript-only-remove-remaining-ts]
    paths: [scripts/migrate-remaining-ts.mjs]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - run: node scripts/migrate-remaining-ts.mjs
      - run: npm run check:syntax
      - name: Commit syntax-verified JavaScript on PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(js): regenerate 42 JS modules from unchanged TypeScript sources with safe JSDoc"
          git push origin HEAD:refs/heads/refactor/javascript-only-remove-remaining-ts
