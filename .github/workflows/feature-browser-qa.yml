name: Feature browser QA (#113-#116)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'html/**'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.npmrc'
      - '.github/workflows/feature-browser-qa.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked site dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static site
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test real browser flows and capture four radio states
        run: npx playwright test --config tests/playwright-feature.config.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: hanmo-feature-browser-qa
          path: |
            e2e-artifacts/
            test-results/
          retention-days: 7
