name: Temporary lockfile regeneration (review branch only)
on:
  push:
    branches:
      - fix/reproducible-browser-qa-dom-safety-20261122
    paths:
      - package.json
      - .github/workflows/lockfile-bootstrap-temporary.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate exact npm lockfile from pinned manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Print lockfile for review-branch import (temporary)
        run: |
          echo 'HANMO_LOCKFILE_BEGIN'
          base64 -w0 package-lock.json
          echo ''
          echo 'HANMO_LOCKFILE_END'
          sha256sum package-lock.json
