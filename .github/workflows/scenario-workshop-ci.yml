name: Practice complete student workshop
on:
  pull_request:
    paths:
      - 'js/scenario-engine.js'
      - 'js/scenario-composite.js'
      - 'js/scenario-review.js'
      - 'js/scenario-workshop.js'
      - 'tests/scenario-composite.test.cjs'
      - 'tests/scenario-review.test.cjs'
      - 'tests/scenario-workshop.test.cjs'
      - 'html/vsugang.html'
      - 'js/scenario-settings.js'
      - 'css/scenario-settings.css'
      - 'tests/scenario-settings.test.cjs'
      - 'tests/scenario-lab.test.cjs'
      - 'js/scenario-lab.js'

      - '.github/workflows/scenario-workshop-ci.yml'
permissions:
  contents: read
jobs:
  student-workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check js/scenario-engine.js
          node --check js/scenario-composite.js
          node --check js/scenario-review.js
          node --check js/scenario-workshop.js
          node --check js/scenario-settings.js
      - name: All synthetic workflows, decisions, and DOM contracts
        run: |
          node --test tests/scenario-engine.test.cjs \
            tests/scenario-composite.test.cjs \
            tests/scenario-review.test.cjs \
            tests/scenario-workshop.test.cjs \
            tests/scenario-settings.test.cjs \
            tests/scenario-lab.test.cjs
      - name: Prepare independent PC-only local preview
        run: |
          mkdir -p preview
          cp -R html js css img index.html preview/
      - uses: actions/upload-artifact@v4
        with:
          name: hanmo-phase2-workshop-preview
          path: preview/
          retention-days: 3
