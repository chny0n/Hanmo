name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy the original Hanmo domain (original repository only)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'CNAME'
      - 'js/**'
      - 'html/**'
      - 'css/**'
      - 'img/**'
      - 'scripts/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.npmrc'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  student-site:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HANMO_SITE_TARGET: ${{ github.repository == 'chny0n/Hanmo' && github.event_name == 'workflow_dispatch' && inputs.deploy_production && 'production' || 'preview' }}
    concurrency:
      group: hanmo-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      pages-artifact-name: ${{ steps.pages-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Validate original domain and isolate fork preview
        run: |
          test "$(cat CNAME)" = tofuhanmo.com
          if [ "$HANMO_SITE_TARGET" = production ]; then
            test "$GITHUB_REPOSITORY" = chny0n/Hanmo
            test "$(cat dist/CNAME)" = tofuhanmo.com
          else
            test ! -e dist/CNAME
          fi
          test -f dist/index.html
          test -f dist/html/academic-timeline.html
          test -f dist/html/planner.html
          test -f dist/js/student-entry.js
      - name: Name the Pages artifact for this build attempt
        if: ${{ github.ref == 'refs/heads/main' && ((github.repository == 'ot4562-glitch/Hanmo_develop' && github.event_name != 'pull_request') || (github.repository == 'chny0n/Hanmo' && github.event_name == 'workflow_dispatch' && inputs.deploy_production)) }}
        id: pages-artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload the verified student site for Pages
        if: ${{ steps.pages-artifact.outcome == 'success' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          name: ${{ steps.pages-artifact.outputs.name }}

  deploy-pages:
    if: ${{ github.ref == 'refs/heads/main' && ((github.repository == 'ot4562-glitch/Hanmo_develop' && github.event_name != 'pull_request') || (github.repository == 'chny0n/Hanmo' && github.event_name == 'workflow_dispatch' && inputs.deploy_production)) }}
    needs: student-site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    env:
      PAGES_ARTIFACT_NAME: ${{ needs.student-site.outputs.pages-artifact-name }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages for the selected repository
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # REST에 먼저 나타난 산출물이 deploy-pages의 별도 조회에도 반영될 시간을 둔다.
      - name: Wait for the exact Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$PAGES_ARTIFACT_NAME"
          for attempt in $(seq 1 12); do
            if names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name')"; then
              count="$(printf '%s\n' "$names" | grep -Fxc -- "$PAGES_ARTIFACT_NAME" || true)"
              if [ "$count" -eq 1 ]; then
                echo "Exactly one verified Pages artifact is visible."
                sleep 20
                exit 0
              fi
              if [ "$count" -gt 1 ]; then
                echo "::error::Duplicate names for the verified Pages artifact; not deploying."
                exit 1
              fi
            else
              echo "::warning::Artifact metadata API not ready (attempt $attempt)."
            fi
            sleep 3
          done
          echo "::error::Verified Pages artifact did not become visible."
          exit 1
      - name: Check the candidate against current main
        shell: bash
        run: |
          current_main="$(git ls-remote --exit-code "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f 1)"
          if [[ -z "$current_main" || "$current_main" != "$GITHUB_SHA" ]]; then
            echo '::error::The preview candidate is no longer the current main revision.'
            exit 1
          fi
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
