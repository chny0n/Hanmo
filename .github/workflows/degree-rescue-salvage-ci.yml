name: Degree Rescue Academic Salvage
on:
  push:
    branches:
      - feature/degree-rescue-academic-salvage
  pull_request:
    paths:
      - 'degree-rescue/**'
      - '.github/workflows/degree-rescue-salvage-ci.yml'
permissions:
  contents: read
jobs:
  academic-port:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: degree-rescue
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/assert-additive-only.mjs
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: degree-rescue-salvage-static-site
          path: degree-rescue/dist
