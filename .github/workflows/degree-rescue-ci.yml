name: Degree Rescue port check
on:
  push:
    branches:
      - feature/degree-rescue-hufs-one-port
  pull_request:
    paths:
      - 'degree-rescue/**'
      - '.github/workflows/degree-rescue-ci.yml'
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: degree-rescue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: degree-rescue-static-site
          path: degree-rescue/dist
