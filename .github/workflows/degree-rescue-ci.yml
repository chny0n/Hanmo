name: Degree Rescue port check
on:
  pull_request:
    paths:
      - 'degree-rescue/**'
      - '.github/workflows/degree-rescue-ci.yml'

permissions:
  contents: read
concurrency:
  group: degree-rescue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: degree-rescue
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: degree-rescue-static-site
          path: degree-rescue/dist
          retention-days: 3
